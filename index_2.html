:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f8f5;
  --card:#ffffff;
  --ink:#2d3a34;
  --mute:#61756c;
  --line:#d8e5dd;
  --acc:#7a9075;
  --acc-light:#e3ece1;
  --acc2:#ebd27a;
  --chip:#eaf1eb;
  --pastel-yellow:#faf6e1;
  --pastel-green:#eaf3eb;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a231f;
    --card:#24302b;
    --ink:#e4ebe6;
    --mute:#93a89e;
    --line:#31423a;
    --acc:#90a88b;
    --acc-light:#2c3d34;
    --acc2:#ebd27a;
    --chip:#2a3831;
    --pastel-yellow:#333123;
    --pastel-green:#243329;
  }
}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Quicksand',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}

.screen{display:none;opacity:0;transition:opacity .35s ease-in-out;width:100%;min-height:100vh;box-sizing:border-box}
.screen.active{display:flex;flex-direction:column;opacity:1}

.home-container{max-width:480px;margin:auto;padding:32px 20px;text-align:center;width:100%}
.serenity-illustration{width:100%;max-width:180px;height:auto;margin:0 auto 16px;display:block}
h1{font-size:26px;font-weight:700;color:var(--acc);margin:0 0 6px}
.now{font-size:32px;font-weight:700;margin:0;color:var(--ink)}
.date{color:var(--mute);margin:0 0 32px;font-size:15px;text-transform:capitalize}

.home-menu{display:flex;flex-direction:column;gap:14px}
